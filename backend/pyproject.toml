[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "weavepath-backend"
version = "0.1.0"
description = "WeavePath route-aware conversation workflow graph core and FastAPI service"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_core*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
